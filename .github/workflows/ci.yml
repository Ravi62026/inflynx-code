name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Typecheck & Test Matrix
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inflynx
          POSTGRES_PASSWORD: inflynx_dev_pw
          POSTGRES_DB: inflynx_code
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://inflynx:inflynx_dev_pw@localhost:5432/inflynx_code
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Monorepo Typecheck
        run: pnpm run typecheck

      - name: Monorepo Build
        run: pnpm run build

      - name: Run Unit & Security Test Suites
        run: pnpm run test:unit

      - name: Run PostgreSQL & Redis Integration Suite
        run: pnpm run test:integration

      - name: Package VS Code Extension
        run: pnpm run package:vscode

      # Phase 46: supply-chain gate. Only HIGH/CRITICAL advisories block; the step still logs the
      # full audit. Scoped to production deps (dev-tool advisories are triaged separately).
      - name: Dependency Audit (prod, high+)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

  # Phase 46: build/typecheck/unit must stay green on every OS the product ships to, not just
  # Linux. Integration (Postgres/Redis services) stays on the `test` job above.
  platform:
    name: Build & Unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Unit & Security Suites
        run: pnpm run test:unit

